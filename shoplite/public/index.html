<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>ShopLite</title>
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <header>
    <h1>ShopLite</h1>
    <span id="user_label" data-testid="user_label"></span>
  </header>
  <main>
    <section id="login_section">
      <h2>Login</h2>
      <input id="email" data-testid="email_input" placeholder="Email">
      <input id="password" type="password" data-testid="password_input" placeholder="Password">
      <button id="login_button" data-testid="login_button">Login</button>
    </section>
    <section id="products_section">
      <h2>Products</h2>
      <ul id="product_list" data-testid="product_list"></ul>
    </section>
    <section id="cart_section">
      <h2>Cart</h2>
      <ul id="cart_list" data-testid="cart_list"></ul>
      <p>Total: <span id="cart_total" data-testid="cart_total">0.00</span></p>
      <button id="checkout_button" data-testid="checkout_button">Checkout</button>
    </section>
    <p id="message" data-testid="message"></p>
  </main>
  <script src="/app.js"></script>
</body>
</html>
